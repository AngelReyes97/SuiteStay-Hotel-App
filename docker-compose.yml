name: SuiteStay 

services:
  frontend:
    build:
      context: ./SuiteStay/frontend_Angular
    image: angelreyes968/suitestay-frontend:1.0
    container_name: frontend-container
    ports:
      - "80:80"
    networks:
      - suiteStayNetwork

  backend:
    build:
      context: ./SuiteStay/backend_SpringBoot/suitestay-backend
    image: angelreyes968/suitestay-backend:1.0
    container_name: backend-container
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - suiteStayNetwork

  mysql:
    image: angelreyes968/suitestay-mysql:1.0
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    networks:
      - suiteStayNetwork
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  suiteStayNetwork:
    driver: bridge