name: SuiteStay 

services:
  frontend:
    build:
      context: ./SuiteStay/frontend_Angular
    image: angelreyes968/suitestay-frontend:1.0
    container_name: frontend-container
    ports:
      - "80:80"
    networks:
      - suiteStayNetwork

  backend:
    build:
      context: ./SuiteStay/backend_SpringBoot/suitestay-backend
    image: angelreyes968/suitestay-backend:1.0
    container_name: backend-container  # Sets a specific container name
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/suitestay_db # Updated MySQL URL
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Reyeslocal123! # Make sure this matches the MySQL password
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - suiteStayNetwork

  mysql:
    image: angelreyes968/suitestay-mysql:1.0
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: Reyeslocal123! # Corrected MySQL root password
      MYSQL_DATABASE: suitestay_db
    ports:
      - "3307:3306"
    networks:
      - suiteStayNetwork
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  suiteStayNetwork:
    driver: bridge